name: Pytest Selenium Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [closed]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      email1: ${{ secrets.EMAIL1 }}
      email2: ${{ secrets.EMAIL2 }}
      email3: ${{ secrets.EMAIL3 }}
      email4: ${{ secrets.EMAIL4 }}
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Create report directory
      run: mkdir -p html-results

    - name: Run your tests
      run: pytest --browser_name=chrome_headless --retries 5 --retry-delay 5 --html=html-results/pytest_report.html

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-html-report
        path: html-results/
